<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>PULSE を追加</title>
    <script src="https://res.cdn.office.net/teams-js/2.19.0/js/MicrosoftTeams.min.js" crossorigin="anonymous"></script>
    <style>
      body {
        margin: 0; padding: 24px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
        color: #1f1f2e; font-size: 14px;
      }
      h1 { font-size: 18px; margin: 0 0 6px; color: #0d9268; }
      p.muted { color: #6b6b80; margin: 0 0 16px; }
      label { display: block; font-weight: 600; margin-bottom: 4px; }
      input { width: 100%; padding: 9px 12px; border-radius: 8px; border: 1px solid #e2e2ee; font-size: 14px; margin-bottom: 14px; box-sizing: border-box; }
    </style>
  </head>
  <body>
    <h1>PULSE をこのチャネル・会議に追加</h1>
    <p class="muted">
      PULSE の管理画面で対象イベントの「閲覧専用リンク」を開き、URL の r= の値をルーム名、key= の値を鍵として入力してください。
      あとで「保存」から変更できます。
    </p>
    <label for="room">ルーム名</label>
    <input id="room" placeholder="例: CRAFT2026" />
    <label for="key">閲覧用の鍵（viewKey）</label>
    <input id="key" type="password" />

    <script>
      var CONTENT_URL_BASE = location.origin + location.pathname.replace(/config\.html$/, "index.html");

      microsoftTeams.app.initialize().then(function () {
        microsoftTeams.pages.config.registerOnSaveHandler(function (saveEvent) {
          var room = document.getElementById("room").value.trim();
          var key = document.getElementById("key").value.trim();
          var contentUrl = CONTENT_URL_BASE + "?room=" + encodeURIComponent(room) + "&key=" + encodeURIComponent(key);
          microsoftTeams.pages.config.setConfig({
            entityId: "pulse-" + room,
            contentUrl: contentUrl,
            websiteUrl: "https://sw-ars.com",
            suggestedDisplayName: "PULSE" + (room ? "（" + room + "）" : ""),
          }).then(function () {
            saveEvent.notifySuccess();
          }).catch(function (err) {
            // Teams が利用者に表示する文言なので、例外の英語メッセージは渡さず console に残す
            console.error("[PULSE] タブの設定の保存に失敗", err);
            saveEvent.notifyFailure("タブの設定を保存できませんでした。もう一度お試しください");
          });
        });

        function updateValidity() {
          var room = document.getElementById("room").value.trim();
          var key = document.getElementById("key").value.trim();
          microsoftTeams.pages.config.setValidityState(!!(room && key));
        }
        document.getElementById("room").addEventListener("input", updateValidity);
        document.getElementById("key").addEventListener("input", updateValidity);
        updateValidity();
      });
    </script>
  </body>
</html>
